[package]
name = "umcf-cloudrun-fallback"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stateless container control-plane fallback for UMCF on Google Cloud Run"

[[bin]]
name = "umcf-cloudrun-fallback"
path = "src/main.rs"

[dependencies]
umcf-core = { workspace = true }
umcf-proto = { workspace = true }
umcf-identity = { workspace = true }
umcf-registry = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[lints]
workspace = true
