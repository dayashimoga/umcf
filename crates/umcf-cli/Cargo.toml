[package]
name = "umcf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface (`umcf`) for Universal Mobile Compute Fabric diagnostics, protocol verification, and cluster scheduling"

[[bin]]
name = "umcf"
path = "src/main.rs"

[dependencies]
umcf-coordinator = { path = "../umcf-coordinator" }
umcf-core = { path = "../umcf-core" }
umcf-proto = { path = "../umcf-proto" }
umcf-scheduler = { path = "../umcf-scheduler" }
umcf-worker = { path = "../umcf-worker" }

[lints]
workspace = true

