[package]
name = "umcf-net"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "LAN discovery (mDNS/DNS-SD, signed UDP multicast beacon), QUIC mesh transport, and NAT traversal for UMCF"

[dependencies]
umcf-proto.workspace = true
umcf-core.workspace = true
umcf-identity.workspace = true
umcf-registry.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time", "rt", "macros"] }
tokio-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bincode = { workspace = true }
blake3.workspace = true
thiserror.workspace = true
tracing.workspace = true
ed25519-dalek.workspace = true
smallvec.workspace = true
bytes.workspace = true
hex = "0.4"
sha2 = "0.11"
socket2 = "0.6"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types.workspace = true
rcgen.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
