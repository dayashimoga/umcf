[package]
name = "umcf-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Heterogeneous capability-aware DAG scheduler, Roofline cost model, and layer partitioner for UMCF"

[dependencies]
umcf-core = { path = "../umcf-core" }
umcf-coordinator = { path = "../umcf-coordinator" }
umcf-enrollment = { path = "../umcf-enrollment" }
umcf-guard = { path = "../umcf-guard" }
umcf-hwprobe = { path = "../umcf-hwprobe" }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
