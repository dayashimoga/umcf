[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "umcf"
version = "0.1.0"
description = "Official Python Client SDK for the Universal Mobile Compute Fabric"
readme = "README.md"
authors = [{ name = "UMCF Platform Engineering" }]
license = { text = "Apache-2.0 OR MIT" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["umcf*"]
