[workspace]
resolver = "2"
members = [
    "crates/umcf-proto",
    "crates/umcf-core",
    "crates/umcf-identity",
    "crates/umcf-enrollment",
    "crates/umcf-registry",
    "crates/umcf-telemetry",
    "crates/umcf-coordinator",
    "crates/umcf-worker",
    "crates/umcf-scheduler",
    "crates/umcf-net",
    "crates/umcf-hwprobe",
    "crates/umcf-guard",
    "crates/umcf-gguf",
    "crates/umcf-llama-sys",
    "crates/umcf-ai",
    "crates/umcf-gpu",
    "crates/umcf-media",
    "crates/umcf-stream",
    "crates/umcf-storage",
    "crates/umcf-api-gateway",
    "crates/umcf-sdk",
    "crates/umcf-cli",
    "crates/umcf-manifest",
    "crates/umcf-ledger",
    "crates/umcf-daemon",
    "services/control-plane-cloudrun",
    "services/cloudrun_fallback",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 OR MIT"
authors = ["UMCF Engineering Team"]
repository = "https://github.com/umcf/universal-mobile-compute-fabric"

[workspace.dependencies]
umcf-proto = { path = "crates/umcf-proto" }
umcf-core = { path = "crates/umcf-core" }
umcf-telemetry = { path = "crates/umcf-telemetry" }
umcf-identity = { path = "crates/umcf-identity" }
umcf-enrollment = { path = "crates/umcf-enrollment" }
umcf-registry = { path = "crates/umcf-registry" }
umcf-coordinator = { path = "crates/umcf-coordinator" }
umcf-worker = { path = "crates/umcf-worker" }
umcf-scheduler = { path = "crates/umcf-scheduler" }
umcf-net = { path = "crates/umcf-net" }
umcf-hwprobe = { path = "crates/umcf-hwprobe" }
umcf-guard = { path = "crates/umcf-guard" }
umcf-gguf = { path = "crates/umcf-gguf" }
umcf-llama-sys = { path = "crates/umcf-llama-sys" }
umcf-ai = { path = "crates/umcf-ai" }
umcf-gpu = { path = "crates/umcf-gpu" }
umcf-media = { path = "crates/umcf-media" }
umcf-stream = { path = "crates/umcf-stream" }
umcf-storage = { path = "crates/umcf-storage" }
umcf-api-gateway = { path = "crates/umcf-api-gateway" }
umcf-sdk = { path = "crates/umcf-sdk" }
umcf-manifest = { path = "crates/umcf-manifest" }
umcf-ledger = { path = "crates/umcf-ledger" }
serde_yaml = "0.9.34"
toml = "0.8.19"
redb = "2.3.0"
rayon = "1.12.0"
smallvec = { version = "1.13.2", features = ["serde"] }
proptest = "1.6.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2.0.1", features = ["zeroize", "static_secrets"] }
zeroize = { version = "1.8.1", features = ["derive"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
bs58 = "0.5.1"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
async-trait = "0.1.86"
rcgen = "0.13.2"
rustls-pki-types = "1.10.1"
tempfile = "3.17.1"
blake3 = "1.8.7"
bytes = "1.12.1"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
zstd = "0.14.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
bincode = "1.3.3"
schemars = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.test.package.ed25519-dalek]
opt-level = 3

[profile.test.package.curve25519-dalek]
opt-level = 3

