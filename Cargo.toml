[workspace]
resolver = "2"
members = [
    "crates/umcf-proto",
    "crates/umcf-core",
    "crates/umcf-telemetry",
    "crates/umcf-coordinator",
    "crates/umcf-worker",
    "crates/umcf-scheduler",
    "crates/umcf-cli",
    "crates/umcf-daemon",
    "services/control-plane-cloudrun",
    "services/cloudrun_fallback",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 OR MIT"
authors = ["UMCF Engineering Team"]
repository = "https://github.com/umcf/universal-mobile-compute-fabric"

[workspace.dependencies]
umcf-proto = { path = "crates/umcf-proto" }
umcf-core = { path = "crates/umcf-core" }
umcf-telemetry = { path = "crates/umcf-telemetry" }
umcf-coordinator = { path = "crates/umcf-coordinator" }
umcf-worker = { path = "crates/umcf-worker" }
umcf-scheduler = { path = "crates/umcf-scheduler" }
blake3 = "1.8.7"
bytes = "1.12.1"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
zstd = "0.14.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
bincode = "1.3.3"
schemars = "1.2.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"

