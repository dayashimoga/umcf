name: "CI — Flutter Multi-Platform Client (Android, Windows, Linux, macOS, iOS)"

on:
  push:
    branches: ["main", "release/**"]
    tags: ["v*.*.*"]
    paths:
      - "apps/mobile-desktop/**"
      - ".github/workflows/ci-flutter.yml"
  pull_request:
    branches: ["main", "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FLUTTER_VERSION: "3.24.0"

jobs:
  # ============================================================================
  # JOB 1: Static Analysis, Linting, Unit & Widget Tests + Coverage
  # ============================================================================
  analyze-and-test:
    name: "Flutter Analyze, Tests & Coverage Report"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile-desktop
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Fetch Pub Dependencies
        run: flutter pub get

      - name: Run Static Analysis (`flutter analyze`)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Execute Unit & Widget Tests with Coverage (`flutter test --coverage`)
        run: |
          flutter test --coverage
          mkdir -p coverage-report
          cp coverage/lcov.info coverage-report/lcov.info
          cat <<EOF > coverage-report/build-metadata.json
          {
            "artifact_id": "umcf-flutter-coverage-report",
            "component": "apps/mobile-desktop",
            "git_commit_sha": "${GITHUB_SHA}",
            "git_ref": "${GITHUB_REF}",
            "github_run_id": "${GITHUB_RUN_ID}",
            "flutter_version": "${FLUTTER_VERSION}",
            "generated_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          cd coverage-report
          sha256sum lcov.info build-metadata.json > SHA256SUMS.txt

      - name: Upload Flutter Test & Coverage Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: umcf-flutter-coverage-report
          path: apps/mobile-desktop/coverage-report/
          if-no-files-found: error
          retention-days: 90

  # ============================================================================
  # JOB 2: Android Release Build (APK & AAB uploaded independently)
  # ============================================================================
  build-android:
    name: "Build Android Release (APK & AAB)"
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile-desktop
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 JDK for Android Gradle Build
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Fetch Pub Dependencies & Generate SBOM
        run: |
          flutter pub get
          flutter pub deps --json > pub-sbom.json

      - name: Build Android Release APK (`flutter build apk --release`)
        run: flutter build apk --release

      - name: Build Android Release AppBundle (`flutter build appbundle --release`)
        run: flutter build appbundle --release

      - name: Package Independent Android APK & AAB Artifacts with Checksums & Metadata
        run: |
          mkdir -p dist-apk dist-aab
          cp build/app/outputs/flutter-apk/app-release.apk dist-apk/umcf-android-release.apk
          cp pub-sbom.json dist-apk/sbom.pub.json

          cat <<EOF > dist-apk/build-metadata.json
          {
            "artifact_id": "umcf-android-apk",
            "platform": "android",
            "package_format": "apk",
            "binary_file": "umcf-android-release.apk",
            "git_commit_sha": "${GITHUB_SHA}",
            "git_tag": "${GITHUB_REF_NAME}",
            "github_run_id": "${GITHUB_RUN_ID}",
            "built_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          (cd dist-apk && sha256sum umcf-android-release.apk sbom.pub.json build-metadata.json > SHA256SUMS.txt)

          cp build/app/outputs/bundle/release/app-release.aab dist-aab/umcf-android-release.aab
          cp pub-sbom.json dist-aab/sbom.pub.json

          cat <<EOF > dist-aab/build-metadata.json
          {
            "artifact_id": "umcf-android-aab",
            "platform": "android",
            "package_format": "aab",
            "binary_file": "umcf-android-release.aab",
            "git_commit_sha": "${GITHUB_SHA}",
            "git_tag": "${GITHUB_REF_NAME}",
            "github_run_id": "${GITHUB_RUN_ID}",
            "built_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          (cd dist-aab && sha256sum umcf-android-release.aab sbom.pub.json build-metadata.json > SHA256SUMS.txt)

      - name: Upload Android Release APK Artifact (`umcf-android-apk`)
        uses: actions/upload-artifact@v4
        with:
          name: umcf-android-apk
          path: apps/mobile-desktop/dist-apk/
          if-no-files-found: error
          retention-days: 90

      - name: Upload Android Release AppBundle Artifact (`umcf-android-aab`)
        uses: actions/upload-artifact@v4
        with:
          name: umcf-android-aab
          path: apps/mobile-desktop/dist-aab/
          if-no-files-found: error
          retention-days: 90

  # ============================================================================
  # JOB 3: Windows x64 Standalone Portable Application
  # ============================================================================
  build-windows:
    name: "Build Windows x64 Standalone Application"
    needs: [analyze-and-test]
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile-desktop
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK (Windows)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Enable Windows Desktop & Build Release (`flutter build windows --release`)
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter pub deps --json > pub-sbom.json
          flutter build windows --release

      - name: Package Windows Standalone Portable Application with Checksums & Metadata
        run: |
          mkdir -p dist-windows
          cp -R build/windows/x64/runner/Release/* dist-windows/
          cp pub-sbom.json dist-windows/sbom.pub.json

          cat <<EOF > dist-windows/build-metadata.json
          {
            "artifact_id": "umcf-windows-x64-portable",
            "platform": "windows-x86_64",
            "package_format": "standalone-portable-dir",
            "self_contained_runtime_dependencies": true,
            "git_commit_sha": "${GITHUB_SHA}",
            "git_tag": "${GITHUB_REF_NAME}",
            "github_run_id": "${GITHUB_RUN_ID}",
            "built_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          cd dist-windows
          find . -type f ! -name "SHA256SUMS.txt" -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Windows Standalone Artifact (`umcf-windows-x64-portable`)
        uses: actions/upload-artifact@v4
        with:
          name: umcf-windows-x64-portable
          path: apps/mobile-desktop/dist-windows/
          if-no-files-found: error
          retention-days: 90

  # ============================================================================
  # JOB 4: Linux x64 Native Bundle & AppImage Packaging
  # ============================================================================
  build-linux:
    name: "Build Linux x64 Native Bundle & AppImage"
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile-desktop
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Desktop GTK3 & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev file desktop-file-utils

      - name: Setup Flutter SDK (Linux)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Enable Linux Desktop & Build Release (`flutter build linux --release`)
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter pub deps --json > pub-sbom.json
          flutter build linux --release

      - name: Package Linux Standalone Bundle, SBOM, Metadata & SHA-256 Checksums
        run: |
          mkdir -p dist-linux
          cp -R build/linux/x64/release/bundle/* dist-linux/
          cp pub-sbom.json dist-linux/sbom.pub.json

          cat <<EOF > dist-linux/build-metadata.json
          {
            "artifact_id": "umcf-linux-x64-bundle",
            "platform": "linux-x86_64",
            "package_format": "native-gtk-bundle",
            "self_contained_runtime_dependencies": true,
            "git_commit_sha": "${GITHUB_SHA}",
            "git_tag": "${GITHUB_REF_NAME}",
            "github_run_id": "${GITHUB_RUN_ID}",
            "built_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          cd dist-linux
          find . -type f ! -name "SHA256SUMS.txt" -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Linux Native Bundle Artifact (`umcf-linux-x64-bundle`)
        uses: actions/upload-artifact@v4
        with:
          name: umcf-linux-x64-bundle
          path: apps/mobile-desktop/dist-linux/
          if-no-files-found: error
          retention-days: 90

  # ============================================================================
  # JOB 5: macOS Native Application Bundle (`.app`)
  # ============================================================================
  build-macos:
    name: "Build macOS Universal Native Application"
    needs: [analyze-and-test]
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile-desktop
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK (macOS)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Enable macOS Desktop & Build Release (`flutter build macos --release`)
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter pub deps --json > pub-sbom.json
          flutter build macos --release

      - name: Package macOS `.app` Bundle with Metadata, SBOM & SHA-256 Checksums
        run: |
          mkdir -p dist-macos
          cp -R build/macos/Build/Products/Release/*.app dist-macos/
          cp pub-sbom.json dist-macos/sbom.pub.json

          cat <<EOF > dist-macos/build-metadata.json
          {
            "artifact_id": "umcf-macos-universal-app",
            "platform": "macos-universal",
            "package_format": "macos-app-bundle",
            "git_commit_sha": "${GITHUB_SHA}",
            "git_tag": "${GITHUB_REF_NAME}",
            "github_run_id": "${GITHUB_RUN_ID}",
            "built_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          cd dist-macos
          find . -type f ! -name "SHA256SUMS.txt" -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload macOS Application Bundle Artifact (`umcf-macos-universal-app`)
        uses: actions/upload-artifact@v4
        with:
          name: umcf-macos-universal-app
          path: apps/mobile-desktop/dist-macos/
          if-no-files-found: error
          retention-days: 90

  # ============================================================================
  # JOB 6: iOS Build & Archive (Signed IPA when secrets configured; Unsigned Archive with explicit metadata otherwise)
  # ============================================================================
  build-ios:
    name: "Build iOS Application (Signed IPA or Documented Unsigned Archive)"
    needs: [analyze-and-test]
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile-desktop
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK (iOS)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Evaluate Apple Code-Signing Credentials Availability
        id: ios_signing_check
        env:
          HAS_CERT: ${{ secrets.IOS_CERTIFICATE_P12 != '' }}
          HAS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE != '' }}
        run: |
          if [ "${HAS_CERT}" = "true" ] && [ "${HAS_PROFILE}" = "true" ]; then
            echo "signing_configured=true" >> "$GITHUB_OUTPUT"
            echo "artifact_name=umcf-ios-signed-ipa" >> "$GITHUB_OUTPUT"
          else
            echo "signing_configured=false" >> "$GITHUB_OUTPUT"
            echo "artifact_name=umcf-ios-unsigned-archive" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Pub Dependencies & Generate SBOM
        run: |
          flutter pub get
          flutter pub deps --json > pub-sbom.json

      - name: Build Signed iOS IPA (When Apple Signing Secrets Are Present)
        if: steps.ios_signing_check.outputs.signing_configured == 'true'
        run: |
          flutter build ipa --release
          mkdir -p dist-ios
          cp -R build/ios/ipa/*.ipa dist-ios/
          cp pub-sbom.json dist-ios/sbom.pub.json
          cat <<EOF > dist-ios/ios-build-manifest.json
          {
            "artifact_id": "umcf-ios-signed-ipa",
            "platform": "ios-arm64",
            "signed": true,
            "signing_limitation": null,
            "package_format": "ipa",
            "git_commit_sha": "${GITHUB_SHA}",
            "git_tag": "${GITHUB_REF_NAME}",
            "github_run_id": "${GITHUB_RUN_ID}",
            "built_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          cd dist-ios
          find . -type f ! -name "SHA256SUMS.txt" -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt

      - name: Build Unsigned iOS Release Archive (`flutter build ios --release --no-codesign`)
        if: steps.ios_signing_check.outputs.signing_configured == 'false'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p dist-ios
          cp -R build/ios/iphoneos/Runner.app dist-ios/Runner.app
          cp pub-sbom.json dist-ios/sbom.pub.json
          cat <<EOF > dist-ios/ios-build-manifest.json
          {
            "artifact_id": "umcf-ios-unsigned-archive",
            "platform": "ios-arm64",
            "signed": false,
            "signing_limitation": "Unsigned .xcarchive/.app bundle; valid Apple Developer signing credentials required for installable IPA",
            "re_signing_instructions": "Sign Runner.app with codesign and package into Payload/Runner.app -> umcf.ipa using an active Apple Developer Provisioning Profile.",
            "package_format": "unsigned-ios-app-archive",
            "git_commit_sha": "${GITHUB_SHA}",
            "git_tag": "${GITHUB_REF_NAME}",
            "github_run_id": "${GITHUB_RUN_ID}",
            "built_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          cd dist-ios
          find . -type f ! -name "SHA256SUMS.txt" -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload iOS Build Artifact (${{ steps.ios_signing_check.outputs.artifact_name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ios_signing_check.outputs.artifact_name }}
          path: apps/mobile-desktop/dist-ios/
          if-no-files-found: error
          retention-days: 90
