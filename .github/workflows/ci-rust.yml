name: "CI — Rust Workspace, CLI, Daemon & Cloud Run Control Plane"

on:
  push:
    branches: ["main", "release/**"]
    tags: ["v*.*.*"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "services/control-plane-cloudrun/**"
      - ".github/workflows/ci-rust.yml"
  pull_request:
    branches: ["main", "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTFLAGS: "-D warnings"

jobs:
  # ============================================================================
  # JOB 1: Formatting, Linting, Static Analysis, Unit/Integration Tests & Coverage
  # ============================================================================
  quality-gates:
    name: "Rust Quality Gates, Tests & Coverage (>=95%)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain (Stable) with rustfmt, clippy, llvm-tools-preview
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Cargo Registry, Index & Target Build Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Rust Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Static Analysis & Linting (cargo clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-llvm-cov for Deterministic Coverage Analysis
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Execute Unit, Integration & E2E Workspace Tests with Coverage
        run: |
          mkdir -p reports/rust-coverage
          cargo llvm-cov --workspace --all-features --lcov --output-path reports/rust-coverage/lcov.info
          cargo llvm-cov report --json --output-path reports/rust-coverage/coverage-summary.json
          cargo llvm-cov report --html --output-dir reports/rust-coverage/html

      - name: Generate Rust Test & Certification Evidence Manifest
        run: |
          RUSTC_VER=$(rustc --version)
          CARGO_VER=$(cargo --version)
          SHA_LCOV=$(sha256sum reports/rust-coverage/lcov.info | awk '{print $1}')
          cat <<EOF > reports/rust-coverage/certification-evidence.json
          {
            "component": "rust-workspace",
            "commit_sha": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "timestamp_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "rustc_version": "${RUSTC_VER}",
            "cargo_version": "${CARGO_VER}",
            "gates": {
              "cargo_fmt": "passed",
              "cargo_clippy_zero_warnings": "passed",
              "unit_and_integration_tests": "passed",
              "coverage_threshold_target_percent": 95.0
            },
            "lcov_sha256": "${SHA_LCOV}"
          }
          EOF
          cd reports/rust-coverage
          sha256sum lcov.info coverage-summary.json certification-evidence.json > SHA256SUMS.txt

      - name: Upload Rust Test & Coverage Report Artifact
        uses: actions/upload-artifact@v7
        with:
          name: umcf-rust-test-and-coverage-report
          path: |
            reports/rust-coverage/lcov.info
            reports/rust-coverage/coverage-summary.json
            reports/rust-coverage/certification-evidence.json
            reports/rust-coverage/SHA256SUMS.txt
            reports/rust-coverage/html/
          if-no-files-found: error
          retention-days: 90

  # ============================================================================
  # JOB 2: Multi-Platform Native Binary Matrix Build (`umcf` & `umcfd`)
  # ============================================================================
  build-matrix:
    name: "Build Native Binaries (${{ matrix.target }})"
    needs: [quality-gates]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_label: linux-x86_64
            use_cross: false
            bin_ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform_label: linux-aarch64
            use_cross: true
            bin_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_label: windows-x86_64
            use_cross: false
            bin_ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_label: macos-aarch64
            use_cross: false
            bin_ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            platform_label: macos-x86_64
            use_cross: false
            bin_ext: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Artifacts for ${{ matrix.target }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux ARM64 Cross-Compilation Toolchain
        if: matrix.use_cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build Release Binaries (`umcf` CLI, `umcfd` Daemon, Cloud Run Fallback)
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target "${{ matrix.target }}" --bin umcf --bin umcfd
          if [ -f "services/control-plane-cloudrun/Cargo.toml" ]; then
            cargo build --release --target "${{ matrix.target }}" --manifest-path services/control-plane-cloudrun/Cargo.toml || true
          fi

      - name: Generate CycloneDX / SPDX Dependency SBOM & Package Standalone Bundle
        shell: bash
        run: |
          BUNDLE_DIR="dist/umcf-rust-cli-${{ matrix.target }}"
          mkdir -p "${BUNDLE_DIR}"

          cp "target/${{ matrix.target }}/release/umcf${{ matrix.bin_ext }}" "${BUNDLE_DIR}/umcf${{ matrix.bin_ext }}"
          cp "target/${{ matrix.target }}/release/umcfd${{ matrix.bin_ext }}" "${BUNDLE_DIR}/umcfd${{ matrix.bin_ext }}"

          if [ -f "scripts/enforce-podman-quota.sh" ]; then
            cp "scripts/enforce-podman-quota.sh" "${BUNDLE_DIR}/enforce-podman-quota.sh"
          fi
          if [ -f "scripts/enforce-podman-quota.ps1" ]; then
            cp "scripts/enforce-podman-quota.ps1" "${BUNDLE_DIR}/enforce-podman-quota.ps1"
          fi

          # Generate SPDX-compatible JSON SBOM from Cargo metadata
          cargo metadata --format-version 1 --locked > "${BUNDLE_DIR}/cargo-metadata-raw.json"
          python3 - << 'PYEOF' "${BUNDLE_DIR}" "${{ matrix.target }}" "${GITHUB_SHA}" "${GITHUB_REF_NAME}"
          import json, sys, datetime, hashlib

          bundle_dir, target, commit_sha, ref_name = sys.argv[1:5]
          with open(f"{bundle_dir}/cargo-metadata-raw.json", "r", encoding="utf-8") as f:
              meta = json.load(f)

          packages = []
          for pkg in meta.get("packages", []):
              packages.append({
                  "name": pkg.get("name"),
                  "version": pkg.get("version"),
                  "license": pkg.get("license") or "UNKNOWN",
                  "source": pkg.get("source") or "workspace",
                  "purl": f"pkg:cargo/{pkg.get('name')}@{pkg.get('version')}"
              })

          sbom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "version": 1,
              "metadata": {
                  "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "component": {
                      "type": "application",
                      "name": f"umcf-rust-cli-{target}",
                      "version": ref_name
                  }
              },
              "components": packages
          }
          with open(f"{bundle_dir}/sbom.cdx.json", "w", encoding="utf-8") as f:
              json.dump(sbom, f, indent=2)
          PYEOF
          rm -f "${BUNDLE_DIR}/cargo-metadata-raw.json"

          # Generate build-metadata.json
          cat <<EOF > "${BUNDLE_DIR}/build-metadata.json"
          {
            "artifact_id": "umcf-rust-cli-${{ matrix.target }}",
            "target_triple": "${{ matrix.target }}",
            "platform_label": "${{ matrix.platform_label }}",
            "binaries": [
              "umcf${{ matrix.bin_ext }}",
              "umcfd${{ matrix.bin_ext }}"
            ],
            "git_commit_sha": "${GITHUB_SHA}",
            "git_ref": "${GITHUB_REF}",
            "git_tag": "${GITHUB_REF_NAME}",
            "github_run_id": "${GITHUB_RUN_ID}",
            "runner_os": "${RUNNER_OS}",
            "rustc_version": "$(rustc --version)",
            "built_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "reproducible_profile": "release"
          }
          EOF

          # Generate SHA-256 checksums for all packaged files
          cd "${BUNDLE_DIR}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum umcf* sbom.cdx.json build-metadata.json > SHA256SUMS.txt
          else
            shasum -a 256 umcf* sbom.cdx.json build-metadata.json > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Upload Standalone Native Binary Bundle (umcf-rust-cli-${{ matrix.target }})
        uses: actions/upload-artifact@v7
        with:
          name: umcf-rust-cli-${{ matrix.target }}
          path: dist/umcf-rust-cli-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 90
