[package]
name = "soak-suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
umcf-core = { workspace = true }
umcf-proto = { workspace = true }
umcf-hwprobe = { workspace = true }
umcf-guard = { workspace = true }
umcf-storage = { workspace = true }
umcf-ledger = { workspace = true }
umcf-marketplace = { workspace = true }
umcf-chaos = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
blake3 = "1.5"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.10"

