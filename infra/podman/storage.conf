# Podman Storage Configuration for Universal Mobile Compute Fabric (UMCF)
# Enforces a strict maximum 30 GB storage budget across container layers and volumes.

[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
# Enforce 30 GB maximum storage allocation (30 GiB)
size = "30G"

[storage.options.overlay]
mountopt = "nodev,metacopy=on"

