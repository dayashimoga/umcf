[config]
default_to_workspace = false

[tasks.default]
alias = "verify"

[tasks.verify]
dependencies = ["lint", "test", "quota-check", "check-placeholders", "verify-governance"]

[tasks.lint]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[tasks.test]
command = "cargo"
args = ["test", "--workspace"]

[tasks.build-all]
dependencies = ["build-rust", "build-web", "build-cf"]

[tasks.build-rust]
command = "cargo"
args = ["build", "--workspace", "--release"]

[tasks.build-web]
script = [
    "node apps/web-dashboard/scripts/build.mjs",
    "node apps/web_console/scripts/build.mjs"
]

[tasks.build-cf]
script = [
    "node services/control-plane-cf/scripts/build.mjs",
    "node services/cf_control_plane/scripts/build.mjs"
]

[tasks.quota-check]
script = [
    "bash scripts/podman-quota-check.sh"
]

[tasks.check-placeholders]
script = [
    "bash scripts/check-no-placeholders.sh"
]

[tasks.verify-governance]
script = [
    "bash scripts/verify-governance.sh"
]
